name: checks

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS-Syntax (app.js + worker)
        run: |
          node --check app.js
          node --check worker/src/index.js
      - name: manifest.json valide
        run: python3 -c "import json; json.load(open('manifest.json'))"
