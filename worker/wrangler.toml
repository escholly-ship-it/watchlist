name = "watchlist-sync"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespace binding.
# Set the real ID via `wrangler kv namespace list` after `wrangler login`,
# then replace the placeholder below before deploy.
[[kv_namespaces]]
binding = "WATCHLIST_KV"
id = "d21a31cf2f614d05a1d5767954abc5c6"

# WL-NUTZUNG-MESSEN (2026-10-30): Tageszaehler je Pseudonym (GET/PUT /sync).
# Angelegt per Cloudflare-Konnektor, Schema worker/schema/nutzung.sql.
[[d1_databases]]
binding = "NUTZUNG_DB"
database_name = "watchlist-nutzung"
database_id = "3d0dc369-ed32-49fe-8605-52dd6281ea75"

# Magazin v3 (2026-11-12): Taeglich frische Magazine fuer ALLE Familienprofile
# innerhalb des kostenlosen 5-Cron-Limits (je Invocation eigenes 50-Subrequest-Budget):
#   "0 3 * * *"  — 03:00 UTC: rotierender 30-Titel-Taste-Prewarm ueber den Roster
#   "15 4 * * *" — 04:15 UTC: taeglicher Morgen-Build fuer Roster-Slot 0 (Owner)
#   "30 4 * * *" — 04:30 UTC: taeglicher Morgen-Build fuer Roster-Slot 1
#   "45 4 * * *" — 04:45 UTC: taeglicher Morgen-Build fuer Roster-Slot 2
#   "0 5 * * *"  — 05:00 UTC: taeglicher Morgen-Build fuer Roster-Slot 3
[triggers]
crons = ["0 3 * * *", "15 4 * * *", "30 4 * * *", "45 4 * * *", "0 5 * * *"]

# Observability — make `wrangler tail` show structured logs.
[observability]
enabled = true

# ── Required secrets (set via `wrangler secret put <NAME>`) ────────────────
# API_KEY              — legacy owner-key for /sync endpoint (PWA, optional)
# ADMIN_KEY            — gate for POST /magazine-build manual trigger
# OWNER_SYNC_KEY       — the owner's 32-char sync-key; used as KV-namespace owner
# TMDB_API_KEY         — TMDB v3 API key
